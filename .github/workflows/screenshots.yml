name: Screenshots

# Takes screenshots of the game on an Android emulator and uploads them as an
# artifact, so that a pull request that changes how the game looks can show it.
# Runs when the drawing code or this file changes, and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/widgets/**'
      - 'lib/screens/**'
      - 'lib/utils/constants.dart'
      - 'lib/utils/game_theme.dart'
      - 'integration_test/screenshots.dart'
      - 'integration_test/helpers.dart'
      - 'test_driver/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.1
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots.dart -d emulator-5554
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: warn
