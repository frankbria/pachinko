name: Integration tests

# The tests in integration_test/ need a device, so they run on an Android
# emulator. That takes several times as long as the CI job, so this is not a
# check on every pull request: it runs when the tests, the drawing code or
# this file change, once a week, and on demand. The drawing code is there
# because a gradient the emulator's software renderer cannot take makes the
# emulator abort (PR #65), and nothing else in CI would notice.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'integration_test/**'
      - 'lib/widgets/**'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.1
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test -d emulator-5554 --timeout 120s
